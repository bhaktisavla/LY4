<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>In-Between Numbers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:"Comic Sans MS",cursive,sans-serif;
background:#fff8ef;
}

/*----------------BACKGROUND----------------*/

body{

background:
radial-gradient(circle at 12% 18%,#ffd54f88 0 140px,transparent 141px),

radial-gradient(circle at 88% 14%,#81d4fa66 0 140px,transparent 141px),

radial-gradient(circle at 20% 82%,#aed58166 0 170px,transparent 171px),

radial-gradient(circle at 92% 82%,#f8bbd066 0 140px,transparent 141px),

linear-gradient(#fffdf7,#fff8ef);

}

/*----------------SCREENS----------------*/

.screen{

position:absolute;

inset:0;

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

}

.show{

display:flex;

}

/*----------------LOGO----------------*/

#logoScreen img{

width:min(320px,70vw);

}

/*----------------TITLE----------------*/

#titleScreen h1{

font-size:clamp(42px,6vw,72px);

color:#ff4081;

text-shadow:3px 3px white;

animation:bounce .9s infinite alternate;

}

@keyframes bounce{

from{transform:scale(1);}

to{transform:scale(1.08);}

}

/*----------------GAME----------------*/

#gameScreen{

padding:12px;

}

/*----------------TOP PANEL----------------*/

#topPanel{

width:min(1800px,98vw);

background:white;

border:5px solid orange;

border-radius:24px;

padding:10px;

margin-bottom:10px;

}

#roundTitle{

display:none;

}

#questionRow{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

}

#question{

font-size:clamp(18px,1.8vw,30px);

font-weight:bold;

color:#5d4037;

text-align:center;

}

/* SVG speaker */

#speaker{

width:54px;

height:54px;

cursor:pointer;

transition:.25s;

}

#speaker:hover{

transform:scale(1.1);

}

/*----------------QUESTION GRID----------------*/

#questionGrid{

width:min(1800px,98vw);

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-bottom:10px;

}

.questionCard{

background:white;

border:5px solid orange;

border-radius:24px;

height:115px;

display:flex;

justify-content:center;

align-items:center;

box-shadow:0 6px 10px rgba(0,0,0,.12);

}

.numberRow{

display:flex;

align-items:center;

gap:18px;

font-size:clamp(42px,4vw,70px);

font-weight:bold;

color:#3f51b5;

}

.dropBox{

width:86px;

height:72px;

border:5px dashed deeppink;

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

font-size:40px;

background:#fff8fd;

transition:.25s;

}

@keyframes pop{

0%{
transform:scale(1);
}

50%{
transform:scale(1.18);
}

100%{
transform:scale(1);
}

}
            
.dropBox.correct{

background:#c8e6c9;

border-color:#43a047;

box-shadow:0 0 18px #81c784;

animation:pop .25s ease;

}

/*----------------ANSWERS----------------*/

#answerPanel{

width:min(1800px,98vw);

background:white;

border:5px solid orange;

border-radius:24px;

padding:12px;

display:flex;

justify-content:center;

align-items:center;

gap:16px;

flex-wrap:wrap;

}

.answer{

width:82px;

height:62px;

background:#39a8ec;

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

font-size:32px;

font-weight:bold;

color:white;

cursor:grab;

user-select:none;

touch-action:none;

transition:.2s;

}

.answer:hover{

transform:scale(1.06);

}

.answer.used{

visibility:hidden;

}

/*----------------FINAL----------------*/

#finalScreen h1{

font-size:clamp(48px,7vw,90px);

color:#ff4081;

margin-bottom:30px;

text-shadow:3px 3px white;

}

#playAgain{

padding:18px 45px;

font-size:28px;

font-weight:bold;

border:none;

border-radius:18px;

background:#4caf50;

color:white;

cursor:pointer;

}

/*----------------CONFETTI----------------*/

canvas{

position:fixed;

inset:0;

pointer-events:none;

}

/*----------------MOBILE----------------*/

@media(max-width:900px){

#gameScreen{
padding:6px;
}

#topPanel{
padding:8px;
margin-bottom:6px;
}

#question{
font-size:20px;
line-height:1.2;
}

#speaker{
width:42px;
height:42px;
}

#questionGrid{
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:8px;
}

.questionCard{
height:82px;
border-width:4px;
}

.numberRow{
font-size:42px;
gap:12px;
}

.dropBox{
width:56px;
height:48px;
font-size:28px;
border-width:4px;
}

#answerPanel{
padding:8px;
gap:10px;
}

.answer{
width:60px;
height:48px;
font-size:24px;
}

}

</style>

</head>

<body>

<!-- Logo -->

<div id="logoScreen" class="screen show">

<img src="assets/innovine-logo.png">

</div>

<!-- Title -->

<div id="titleScreen" class="screen">

<h1>In-Between Numbers</h1>

</div>

<!-- Game -->

<div id="gameScreen" class="screen">

<div id="topPanel">

<div id="roundTitle">Round 1</div>

<div id="questionRow">

<div id="question">

Identify the in-between number from the given options and drag it into the correct box.

</div>

<div id="speaker">

<svg viewBox="0 0 64 64" width="54" height="54">

<path fill="#ff9800"

d="M8 24h12l16-14v44L20 40H8z"/>

<path fill="none"

stroke="#ff9800"

stroke-width="5"

stroke-linecap="round"

d="M44 22c4 3 6 6 6 10s-2 7-6 10"/>

<path fill="none"

stroke="#ff9800"

stroke-width="5"

stroke-linecap="round"

d="M50 16c6 5 10 10 10 16s-4 11-10 16"/>

</svg>

</div>

</div>

</div>

<div id="questionGrid">

</div>

<div id="answerPanel">

</div>

</div>

<!-- Final -->

<div id="finalScreen" class="screen">

<h1>Well Done!</h1>

<button id="playAgain">

Play Again

</button>

</div>

<canvas id="confetti"></canvas>

<script>
/*=========================================
            AUDIO
=========================================*/

const clapSound=new Audio("assets/clap.mp3");
const wrongSound=new Audio("assets/wrong.mp3");

clapSound.preload="auto";
wrongSound.preload="auto";


/*=========================================
          GAME OBJECTS
=========================================*/

const rounds=[

{

title:"Round 1",

questions:[

{a:25,b:27,ans:26},
{a:14,b:16,ans:15},
{a:38,b:40,ans:39},
{a:1,b:3,ans:2},
{a:42,b:44,ans:43},
{a:29,b:31,ans:30}

]

},

{

title:"Round 2",

questions:[

{a:6,b:8,ans:7},
{a:22,b:24,ans:23},
{a:39,b:41,ans:40},
{a:10,b:12,ans:11},
{a:34,b:36,ans:35},
{a:47,b:49,ans:48}

]

}

];



let currentRound=0;

let solved=0;

let speechUnlocked=false;



const logoScreen=document.getElementById("logoScreen");

const titleScreen=document.getElementById("titleScreen");

const gameScreen=document.getElementById("gameScreen");

const finalScreen=document.getElementById("finalScreen");

const roundTitle=document.getElementById("roundTitle");

const questionGrid=document.getElementById("questionGrid");

const answerPanel=document.getElementById("answerPanel");

const speaker=document.getElementById("speaker");



const questionSentence=

"Identify the in-between number from the given options and drag it into the correct box.";



/*=========================================
      SPEECH
=========================================*/

function speakQuestion(){

if(!speechUnlocked)return;

speechSynthesis.cancel();

const speech=

new SpeechSynthesisUtterance(questionSentence);

speech.rate=.9;

speech.pitch=1;

speech.volume=1;

speechSynthesis.speak(speech);

}



speaker.onclick=()=>{

speechUnlocked=true;

speakQuestion();

};



document.addEventListener("pointerdown",function unlock(){

speechUnlocked=true;

document.removeEventListener("pointerdown",unlock);

});

function speakCorrect(){

if(!speechUnlocked)return;

const speech=new SpeechSynthesisUtterance("Correct!");

speech.rate=0.95;
speech.pitch=1.2;
speech.volume=1;

speechSynthesis.speak(speech);

}

/*=========================================
          START FLOW
=========================================*/

window.addEventListener("load",()=>{

logoScreen.classList.add("show");

setTimeout(()=>{

logoScreen.classList.remove("show");

titleScreen.classList.add("show");

setTimeout(()=>{

titleScreen.classList.remove("show");

gameScreen.classList.add("show");

loadRound();

},2500);

},5000);

});



/*=========================================
          LOAD ROUND
=========================================*/

function loadRound(){

speechSynthesis.cancel()
            
solved=0;

roundTitle.innerHTML=rounds[currentRound].title;

questionGrid.innerHTML="";

answerPanel.innerHTML="";

buildQuestionCards();

buildAnswers();

setTimeout(()=>{

speakQuestion();

},500);

}



/*=========================================
      BUILD QUESTION CARDS
=========================================*/

function buildQuestionCards(){

const data=rounds[currentRound].questions;

data.forEach((item,index)=>{

const card=document.createElement("div");

card.className="questionCard";

card.innerHTML=`

<div class="numberRow">

<div>${item.a}</div>

<div
class="dropBox"
data-answer="${item.ans}">
</div>

<div>${item.b}</div>

</div>

`;

questionGrid.appendChild(card);

});

}



/*=========================================
        BUILD ANSWERS
=========================================*/

function buildAnswers(){

const numbers=

[...rounds[currentRound].questions]

.sort(()=>Math.random()-0.5);

numbers.forEach(item=>{

const answer=document.createElement("div");

answer.className="answer";

answer.draggable=true;

answer.dataset.value=item.ans;

answer.innerHTML=item.ans;

answerPanel.appendChild(answer);

});

enableDragDrop();

}
/*=========================================
        DRAG & DROP ENGINE
=========================================*/

let dragged=null;
let touchItem=null;
let startParent=null;


/*---------- Enable Events ----------*/

function enableDragDrop(){

document.querySelectorAll(".answer").forEach(item=>{

item.addEventListener("dragstart",dragStart);
item.addEventListener("dragend",dragEnd);

item.addEventListener("touchstart",touchStart,{passive:false});
item.addEventListener("touchmove",touchMove,{passive:false});
item.addEventListener("touchend",touchEnd);

});

document.querySelectorAll(".dropBox").forEach(box=>{

box.addEventListener("dragover",dragOver);
box.addEventListener("drop",dropItem);

});

}


/*=========================================
          DESKTOP DRAG
=========================================*/

function dragStart(e){

dragged=this;

e.dataTransfer.setData("text/plain",this.dataset.value);

setTimeout(()=>{

this.style.opacity=".2";

},0);

}


function dragEnd(){

this.style.opacity="1";

dragged=null;

}


function dragOver(e){

e.preventDefault();

}


/*=========================================
            DESKTOP DROP
=========================================*/

function dropItem(e){

e.preventDefault();

if(!dragged)return;

const value=dragged.dataset.value;
const answer=this.dataset.answer;

if(value===answer){

this.innerHTML=value;

this.classList.add("correct");

speakCorrect();

dragged.classList.add("used");

dragged.draggable=false;

dragged.style.pointerEvents="none";

dragged.style.visibility="hidden";

solved++;

checkRoundFinished();

}else{

wrongSound.currentTime=0;

wrongSound.play();

}

}



/*=========================================
            TOUCH START
=========================================*/

function touchStart(e){

if(this.classList.contains("used"))return;

e.preventDefault();

dragged=this;

startParent=this.parentNode;

const touch=e.touches[0];

touchItem=this.cloneNode(true);

touchItem.style.position="fixed";

touchItem.style.left=(touch.clientX-45)+"px";

touchItem.style.top=(touch.clientY-34)+"px";

touchItem.style.width=this.offsetWidth+"px";

touchItem.style.height=this.offsetHeight+"px";

touchItem.style.display="flex";

touchItem.style.justifyContent="center";

touchItem.style.alignItems="center";

touchItem.style.zIndex="99999";

touchItem.style.pointerEvents="none";

touchItem.style.opacity=".9";

touchItem.style.transform="scale(1.08)";

document.body.appendChild(touchItem);

this.style.opacity=".25";

}



/*=========================================
            TOUCH MOVE
=========================================*/

function touchMove(e){

if(!touchItem)return;

e.preventDefault();

const touch=e.touches[0];

touchItem.style.left=(touch.clientX-touchItem.offsetWidth/2)+"px";

touchItem.style.top=(touch.clientY-touchItem.offsetHeight/2)+"px";

}



/*=========================================
            TOUCH END
=========================================*/

function touchEnd(e){

if(!touchItem)return;

const touch=e.changedTouches[0];

const target=document.elementFromPoint(

touch.clientX,

touch.clientY

);

if(

target &&

target.classList.contains("dropBox")

){

const value=dragged.dataset.value;

const answer=target.dataset.answer;

if(value===answer){

target.innerHTML=value;

target.classList.add("correct");

speakCorrect();

dragged.classList.add("used");

dragged.style.visibility="hidden";

dragged.style.pointerEvents="none";

solved++;

checkRoundFinished();

}else{

wrongSound.currentTime=0;

wrongSound.play();

dragged.style.opacity="1";

}

}else{

dragged.style.opacity="1";

}

touchItem.remove();

touchItem=null;

dragged=null;

}
/*=========================================
        ROUND COMPLETION
=========================================*/

function checkRoundFinished(){

const total=rounds[currentRound].questions.length;

if(solved<total)return;

setTimeout(finishRound,700);

}


/*=========================================
        SPEAK GOOD JOB
=========================================*/

function speakGoodJob(){

if(!speechUnlocked)return;

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance("Good Job!");

speech.rate=0.9;
speech.pitch=1;
speech.volume=1;

speechSynthesis.speak(speech);

}


/*=========================================
          FINISH ROUND
=========================================*/

function finishRound(){

clapSound.currentTime=0;
clapSound.play();

speakGoodJob();

if(currentRound===0){

setTimeout(()=>{

currentRound++;

loadRound();

},2500);

}
else{

setTimeout(()=>{

showFinalScreen();

},2500);

}

}


/*=========================================
        FINAL SCREEN
=========================================*/

function showFinalScreen(){

gameScreen.classList.remove("show");

finalScreen.classList.add("show");

startConfetti();

}


/*=========================================
              CONFETTI
=========================================*/

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

let confettiPieces=[];
let confettiAnimation=null;

function resizeCanvas(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);


/*=========================================
          CREATE CONFETTI
=========================================*/

function createConfetti(){

confettiPieces=[];

const colors=[
"#ff1744",
"#ff9800",
"#ffeb3b",
"#4caf50",
"#00bcd4",
"#3f51b5",
"#9c27b0",
"#e91e63"
];

for(let i=0;i<300;i++){

confettiPieces.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height-canvas.height,

size:Math.random()*10+6,

speed:Math.random()*4+3,

drift:(Math.random()-0.5)*4,

rotation:Math.random()*360,

rotationSpeed:(Math.random()-0.5)*12,

color:colors[
Math.floor(Math.random()*colors.length)
]

});

}

}


/*=========================================
            DRAW
=========================================*/

function drawConfetti(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

confettiPieces.forEach(piece=>{

ctx.save();

ctx.translate(
piece.x,
piece.y
);

ctx.rotate(
piece.rotation*Math.PI/180
);

ctx.fillStyle=piece.color;

ctx.fillRect(

-piece.size/2,

-piece.size/2,

piece.size,

piece.size*1.3

);

ctx.restore();

});

}


/*=========================================
            UPDATE
=========================================*/

function updateConfetti(){

confettiPieces.forEach(piece=>{

piece.y+=piece.speed;

piece.x+=piece.drift;

piece.rotation+=piece.rotationSpeed;

if(piece.y>canvas.height+30){

piece.y=-20;

piece.x=Math.random()*canvas.width;

}

});

}


/*=========================================
          ANIMATION
=========================================*/

function animateConfetti(){

drawConfetti();

updateConfetti();

confettiAnimation=
requestAnimationFrame(
animateConfetti
);

}


/*=========================================
          START
=========================================*/

function startConfetti(){

resizeCanvas();

createConfetti();

if(confettiAnimation){

cancelAnimationFrame(
confettiAnimation
);

}

animateConfetti();

}


/*=========================================
            STOP
=========================================*/

function stopConfetti(){

if(confettiAnimation){

cancelAnimationFrame(
confettiAnimation
);

confettiAnimation=null;

}

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}
/*=========================================
        RESET FUNCTIONS
=========================================*/

function resetGame(){

speechSynthesis.cancel();

stopConfetti();

currentRound=0;

solved=0;

questionGrid.innerHTML="";

answerPanel.innerHTML="";

finalScreen.classList.remove("show");

gameScreen.classList.remove("show");

titleScreen.classList.remove("show");

logoScreen.classList.add("show");

setTimeout(()=>{

logoScreen.classList.remove("show");

titleScreen.classList.add("show");

setTimeout(()=>{

titleScreen.classList.remove("show");

gameScreen.classList.add("show");

loadRound();

},2500);

},5000);

}


/*=========================================
        PLAY AGAIN BUTTON
=========================================*/

document
.getElementById("playAgain")
.addEventListener("click",resetGame);


/*=========================================
      KEEP CANVAS RESPONSIVE
=========================================*/

window.addEventListener(

"orientationchange",

()=>{

setTimeout(

resizeCanvas,

300

);

}

);


/*=========================================
        PRELOAD AUDIO
=========================================*/

clapSound.load();
wrongSound.load();


/*=========================================
      PRELOAD LOGO
=========================================*/

const preloadLogo=new Image();

preloadLogo.src="assets/innovine-logo.png";


/*=========================================
          END
=========================================*/

</script>

</body>

</html>
