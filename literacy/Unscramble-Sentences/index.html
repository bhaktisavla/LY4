height:48px;

.cloud2:before{

height:58px;

.cloud2:after{

height:64px;

translateX(0);

}

}

 <script>

/*==================================================
        UNSCRAMBLE SENTENCES – GAME ENGINE
                    PART 1B
==================================================*/

/*==============================
    SCREEN ELEMENTS
==============================*/

const logoScreen = document.getElementById("logoScreen");
const titleScreen = document.getElementById("titleScreen");
const gameScreen = document.getElementById("gameScreen");
const successPopup = document.getElementById("successPopup");
const finishScreen = document.getElementById("finishScreen");

const startBtn = document.getElementById("startBtn");
const playAgainBtn = document.getElementById("playAgainBtn");

const wordTray = document.getElementById("wordTray");
const answerBoard = document.getElementById("answerBoard");

const questionText = document.getElementById("questionText");

const clapSound = document.getElementById("clapSound");
const wrongSound = document.getElementById("wrongSound");

/*==============================
    GAME DATA
==============================*/

const levels = [
  {
    question: "I eat an apple",
    words: ["I", "eat", "an", "apple"]
  },
  {
    question: "She is playing",
    words: ["She", "is", "playing"]
  },
  {
    question: "The sun is bright",
    words: ["The", "sun", "is", "bright"]
  }
];

let currentLevel = 0;

/*==============================
    INIT SCREEN FLOW
==============================*/

window.onload = () => {

  // Show logo first
  logoScreen.style.display = "flex";

  setTimeout(() => {
    logoScreen.style.display = "none";
    titleScreen.style.display = "flex";
  }, 1500);

};
/*==============================
    START BUTTON
==============================*/

startBtn.onclick = () => {

  titleScreen.style.display = "none";
  gameScreen.style.display = "block";

  loadLevel(currentLevel);

};
/*==============================
    LOAD LEVEL
==============================*/

function loadLevel(index) {

  wordTray.innerHTML = "";
  answerBoard.innerHTML = "";

  const level = levels[index];

  // show question (optional reading line)
  questionText.innerText = "Arrange the words correctly";

  // shuffle words
  let shuffled = [...level.words].sort(() => Math.random() - 0.5);

  // create answer slots
  level.words.forEach(() => {
    let slot = document.createElement("div");
    slot.classList.add("dropSlot");

    slot.ondragover = (e) => e.preventDefault();

    slot.ondrop = dropWord;

    answerBoard.appendChild(slot);
  });

  // create word cards
  shuffled.forEach(word => {

    let card = document.createElement("div");
    card.classList.add("wordCard");
    card.innerText = word;

    card.draggable = true;

    card.ondragstart = dragWord;

    wordTray.appendChild(card);

  });

}
/*==============================
    DRAG & DROP LOGIC
==============================*/

let draggedWord = null;

function dragWord(e) {
  draggedWord = e.target;
}

function dropWord(e) {

  if (!draggedWord) return;

  if (e.target.classList.contains("dropSlot") && e.target.innerText === "") {

    e.target.innerText = draggedWord.innerText;

    draggedWord.style.visibility = "hidden";

    checkAnswer();

  }

}
/*==============================
    CHECK ANSWER
==============================*/

function checkAnswer() {

  let slots = document.querySelectorAll(".dropSlot");
  let level = levels[currentLevel];

  let userAnswer = [];

  slots.forEach(slot => {
    userAnswer.push(slot.innerText);
  });

  if (userAnswer.join(" ") === level.words.join(" ")) {

    clapSound.play();

    setTimeout(() => {
      successPopup.style.display = "flex";
    }, 400);

    setTimeout(nextLevel, 1500);

  }

}
/*==============================
    NEXT LEVEL
==============================*/

function nextLevel() {

  successPopup.style.display = "none";

  currentLevel++;

  if (currentLevel < levels.length) {
    loadLevel(currentLevel);
  } else {
    gameScreen.style.display = "none";
    finishScreen.style.display = "flex";
  }

}
/*==============================
    PLAY AGAIN BUTTON
==============================*/

playAgainBtn.onclick = () => {

  finishScreen.style.display = "none";
  titleScreen.style.display = "flex";

  currentLevel = 0;

  wordTray.innerHTML = "";
  answerBoard.innerHTML = "";

};
/*==============================
    SPEAKER BUTTON
==============================*/

speakerBtn.onclick = () => {

  let text = levels[currentLevel].words.join(" ");

  let utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.9;
  utter.pitch = 1;

  window.speechSynthesis.speak(utter);

};
/*==============================
    SAFETY FIX (IMPORTANT)
==============================*/

answerBoard.addEventListener("dragover", (e) => {
  e.preventDefault();
});  
</script>
