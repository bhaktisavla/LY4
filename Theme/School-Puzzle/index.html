<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Puzzle – Jr.KG Game</title>
<style>
    body {
        margin:0;
        font-family: 'Arbutus', cursive;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
    }
    #splash, #titleScreen, #game, #endScreen {
        width:100%;
        height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        position:absolute;
        top:0;
        left:0;
        background: inherit;
    }
    #splash img, #schoolImage {
        max-width: 95%;
        height:auto;
        border-radius:12px;
    }
    h1 {
        font-size: 2.5em;
        margin: 0.5em;
        color:#4b2e83;
        text-align:center;
    }
    #questionBox {
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        margin-bottom:10px;
        font-size:1.5em;
        color:#333;
    }
    #questionBox button {
        font-size:1em;
        padding:0.3em 0.5em;
        cursor:pointer;
    }
    #objectBox {
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
        margin-top:10px;
        background: rgba(255,255,255,0.7);
        padding:10px;
        border-radius:10px;
        max-width: 95%;
    }
    #objectBox img {
        width:60px;
        height:60px;
        cursor:pointer;
        border-radius:8px;
        transition: transform 0.2s;
    }
    #objectBox img.wrong {
        animation: shake 0.3s;
    }
    #objectBox img.correct-glow {
        border: 3px solid green;
        box-shadow: 0 0 15px green;
    }
    #tick {
        position:absolute;
        top:40%;
        font-size:5em;
        color:green;
        display:none;
        animation: pop 0.5s;
    }
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }
    @keyframes pop {
        0% { transform: scale(0); opacity:0; }
        50% { transform: scale(1.2); opacity:1; }
        100% { transform: scale(1); opacity:1; }
    }
    #playAgain {
        padding: 0.5em 1em;
        font-size:1.2em;
        cursor:pointer;
        margin-top:20px;
        border-radius:8px;
        border:none;
        background:#4b2e83;
        color:white;
    }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Title -->
<div id="titleScreen" style="display:none;">
    <h1>School Puzzle</h1>
</div>

<!-- Game -->
<div id="game" style="display:none; flex-direction:column; align-items:center;">
    <div id="questionBox">
        <div>Find the hidden objects:</div>
        <button id="hearAgain">🔊</button>
    </div>
    <img id="schoolImage" src="assets/school.png" alt="School Image">
    <div id="objectBox">
        <img src="assets/ball.png" alt="ball" data-name="ball">
        <img src="assets/bottle.png" alt="bottle" data-name="bottle">
        <img src="assets/crayonbox.png" alt="crayonbox" data-name="crayonbox">
        <img src="assets/paintbrush.png" alt="paintbrush" data-name="paintbrush">
        <img src="assets/pear.png" alt="pear" data-name="pear">
        <img src="assets/pencil.png" alt="pencil" data-name="pencil">
        <img src="assets/schoolbag.png" alt="schoolbag" data-name="schoolbag">
        <img src="assets/scissors.png" alt="scissors" data-name="scissors">
        <img src="assets/watercan.png" alt="watercan" data-name="watercan">
    </div>
</div>

<!-- Tick -->
<div id="tick">✔️</div>

<!-- End Screen -->
<div id="endScreen" style="display:none; flex-direction:column; align-items:center;">
    <h1>Good Job!</h1>
    <button id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="questionVoice" src="assets/correct.mp3"></audio> <!-- Replace with voice mp3 if available -->

<script>
const splash = document.getElementById('splash');
const titleScreen = document.getElementById('titleScreen');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');
const objectImages = document.querySelectorAll('#objectBox img');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');
const tick = document.getElementById('tick');
const hearAgain = document.getElementById('hearAgain');

let foundObjects = 0;
let wrongAttempts = 0;

function resetGame(){
    foundObjects = 0;
    wrongAttempts = 0;
    objectImages.forEach(img => {
        img.classList.remove('correct-glow','wrong');
        img.style.pointerEvents = 'auto';
    });
    tick.style.display = 'none';
    endScreen.style.display='none';
    showSplash();
}

function showSplash(){
    splash.style.display = 'flex';
    titleScreen.style.display = 'none';
    game.style.display = 'none';
    endScreen.style.display = 'none';
    setTimeout(()=>{
        splash.style.display='none';
        titleScreen.style.display='flex';
        setTimeout(()=>{
            titleScreen.style.display='none';
            game.style.display='flex';
            playQuestionVoice();
        },5000);
    },5000);
}

function playQuestionVoice(){
    const questionAudio = document.getElementById('questionVoice');
    questionAudio.play();
}

hearAgain.addEventListener('click',()=>{
    playQuestionVoice();
});

objectImages.forEach(img => {
    img.addEventListener('click',()=>{
        if(img.classList.contains('correct-glow')) return;
        const objectName = img.getAttribute('data-name');
        // For simplicity, all objects are correct in this round
        img.classList.add('correct-glow');
        correctSound.play();
        tick.style.display='block';
        setTimeout(()=> tick.style.display='none',500);
        foundObjects++;
        if(foundObjects===objectImages.length){
            // Game complete
            clapSound.play();
            setTimeout(()=>{
                game.style.display='none';
                endScreen.style.display='flex';
            },1000);
        }
    });
});

document.getElementById('playAgain').addEventListener('click',()=>{
    resetGame();
});

// Initialize
showSplash();
</script>

</body>
</html>
