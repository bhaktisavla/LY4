<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Puzzle – Jr.KG Game</title>
<style>
body {
    margin:0;
    font-family:'Arbutus', cursive;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    overflow:hidden;
}
#splash, #titleScreen, #game, #endScreen {
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:absolute;
    top:0; left:0;
    background:inherit;
}
#splash img, #schoolContainer img {
    width:100%;
    max-width:100%;
    height:auto;
    border-radius:12px;
}
h1 { font-size:2.5em; margin:0.5em; color:#4b2e83; text-align:center; }
#questionBox { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; font-size:1.5em; color:#333; }
#questionBox button { font-size:1em; padding:0.3em 0.5em; cursor:pointer; }
#schoolContainer { position:relative; width:95%; max-width:400px; }
.clickable-area { position:absolute; border-radius:50%; cursor:pointer; transition: transform 0.2s, box-shadow 0.3s; }
.clickable-area.wrong { animation: shake 0.3s; }
.clickable-area.correct { border: 3px solid green; }
.clickable-area.glow { border: 3px solid green; box-shadow:0 0 15px green; }
#tick { position:absolute; top:40%; font-size:5em; color:green; display:none; animation: pop 0.5s; }
#playAgain { padding:0.5em 1em; font-size:1.2em; cursor:pointer; margin-top:20px; border-radius:8px; border:none; background:#4b2e83; color:white; }
.confetti { position: absolute; width: 10px; height: 10px; background: #FFD700; pointer-events:none; animation: fall 3s linear forwards; border-radius:50%; }
@keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
@keyframes pop { 0% { transform: scale(0); opacity:0; } 50% { transform: scale(1.2); opacity:1; } 100% { transform: scale(1); opacity:1; } }
@keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity:1; } 100% { transform: translateY(500px) rotate(720deg); opacity:0; } }
</style>
</head>
<body>

<div id="splash"><img src="assets/innovine-logo.png" alt="Innovine Logo"></div>
<div id="titleScreen" style="display:none;"><h1>School Puzzle</h1></div>
<div id="game" style="display:none; flex-direction:column; align-items:center;">
    <div id="questionBox"><div>Find the hidden objects:</div><button id="hearAgain">🔊</button></div>
    <div id="schoolContainer"><img id="schoolImage" src="assets/school.png" alt="School Image"></div>
</div>
<div id="tick">✔️</div>
<div id="endScreen" style="display:none; flex-direction:column; align-items:center;">
    <h1>Good Job!</h1><button id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="questionVoice" src="assets/question.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const titleScreen = document.getElementById('titleScreen');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');
const tick = document.getElementById('tick');
const hearAgain = document.getElementById('hearAgain');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');
const questionVoice = document.getElementById('questionVoice');

let foundCount=0; let wrongAttempts={}; const totalObjects=9;

// Adjusted coordinates for 312x390 image
const objects=[
{name:'ball', cx:60, cy:130, r:18},
{name:'bottle', cx:280, cy:60, r:18},
{name:'crayonbox', cx:230, cy:310, r:18},
{name:'paintbrush', cx:210, cy:330, r:18},
{name:'pear', cx:50, cy:30, r:18},
{name:'pencil', cx:30, cy:360, r:18},
{name:'schoolbag', cx:150, cy:180, r:18},
{name:'scissors', cx:50, cy:370, r:18},
{name:'watercan', cx:260, cy:340, r:18}
];

const schoolContainer = document.getElementById('schoolContainer');
objects.forEach(obj=>{
    const area=document.createElement('div');
    area.classList.add('clickable-area');
    area.dataset.name=obj.name;
    area.style.left=(obj.cx-obj.r)+'px';
    area.style.top=(obj.cy-obj.r)+'px';
    area.style.width=(obj.r*2)+'px';
    area.style.height=(obj.r*2)+'px';
    schoolContainer.appendChild(area);

    area.addEventListener('click',()=>{
        if(area.classList.contains('correct')) return;
        wrongAttempts[obj.name] = wrongAttempts[obj.name]||0;
        if(wrongAttempts[obj.name]>=2){ area.classList.add('correct','glow'); correctSound.play(); tick.style.display='block'; setTimeout(()=>tick.style.display='none',500); foundCount++; }
        else { area.classList.add('correct'); correctSound.play(); tick.style.display='block'; setTimeout(()=>tick.style.display='none',500); foundCount++; }
        if(foundCount>=totalObjects){ spawnConfetti(); clapSound.play(); setTimeout(()=>{game.style.display='none'; endScreen.style.display='flex';},1000); }
    });
});

function showSplash(){ splash.style.display='flex'; titleScreen.style.display='none'; game.style.display='none'; endScreen.style.display='none';
setTimeout(()=>{ splash.style.display='none'; titleScreen.style.display='flex';
setTimeout(()=>{ titleScreen.style.display='none'; game.style.display='flex'; questionVoice.play();},5000);},5000); }
hearAgain.addEventListener('click',()=>{questionVoice.play();});
document.getElementById('playAgain').addEventListener('click',()=>{foundCount=0; wrongAttempts={}; document.querySelectorAll('.clickable-area').forEach(area=>{area.classList.remove('correct','wrong','glow');}); tick.style.display='none'; endScreen.style.display='none'; showSplash();});
function spawnConfetti(){for(let i=0;i<100;i++){const conf=document.createElement('div'); conf.classList.add('confetti'); conf.style.left=Math.random()*window.innerWidth+'px'; conf.style.background=`hsl(${Math.random()*360},70%,50%)`; conf.style.animationDuration=(2+Math.random()*2)+'s'; document.body.appendChild(conf); setTimeout(()=>conf.remove(),4000);}}
showSplash();
</script>
</body>
</html>
