<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>School Puzzle</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial, sans-serif;
background:linear-gradient(180deg,#8fd3ff,#dff7ff);
}

.screen{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.hidden{
display:none!important;
}

/* Splash */

#logoScreen{
background:linear-gradient(135deg,#fff8c4,#ffe8aa);
}

#logoScreen img{
max-width:320px;
width:70%;
}

#titleScreen{
background:linear-gradient(135deg,#ffd3e0,#ffe8b0);
}

.flashTitle{
font-size:clamp(34px,7vw,70px);
font-weight:bold;
color:#ff5b5b;
animation:pulse 1s infinite;
text-align:center;
}

@keyframes pulse{
50%{transform:scale(1.08);}
}

/* Game */

#gameScreen{
background:
linear-gradient(180deg,#8fd3ff,#dff7ff);
padding:8px;
}

.header{
text-align:center;
width:100%;
}

.header h1{
color:#ff6b35;
font-size:clamp(26px,4vw,42px);
margin-bottom:5px;
}

.questionRow{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.question{
font-size:clamp(18px,2.8vw,30px);
font-weight:bold;
color:#34495e;
}

.listenBtn{
background:#ffcf5a;
border:none;
padding:10px 16px;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.gameArea{
flex:1;
display:flex;
justify-content:center;
align-items:center;
width:100%;
position:relative;
}

.sceneContainer{
position:relative;
height:60vh;
max-height:700px;
}

.sceneContainer img{
height:100%;
display:block;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.hotspot{
position:absolute;
border-radius:50%;
cursor:pointer;
}

.hotspot.correctFound{
border:5px solid #00cc44;
background:rgba(0,255,0,.15);
pointer-events:none;
}

.glow{
animation:glow 1s infinite;
}

@keyframes glow{
0%{box-shadow:0 0 5px yellow;}
50%{box-shadow:0 0 25px yellow;}
100%{box-shadow:0 0 5px yellow;}
}

.wiggle{
animation:wiggle .3s;
}

@keyframes wiggle{
0%{transform:translateX(0);}
25%{transform:translateX(-8px);}
50%{transform:translateX(8px);}
75%{transform:translateX(-8px);}
100%{transform:translateX(0);}
}

.objectBar{
width:100%;
background:white;
border-radius:16px;
padding:8px;
display:grid;
grid-template-columns:repeat(9,1fr);
gap:6px;
margin-top:6px;
}

.objectItem{
background:#f7fbff;
border:2px solid #cfe8ff;
border-radius:12px;
padding:4px;
position:relative;
}

.objectItem img{
width:100%;
aspect-ratio:1/1;
object-fit:contain;
}

.found{
opacity:.35;
}

.tick{
position:absolute;
right:2px;
top:2px;
background:#00c853;
color:white;
width:22px;
height:22px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
}

#finishScreen{
background:linear-gradient(135deg,#c6ffd0,#fff4a8);
text-align:center;
}

#finishScreen h2{
font-size:clamp(34px,5vw,70px);
color:#00a651;
margin-bottom:20px;
}

.playAgain{
padding:16px 30px;
font-size:22px;
border:none;
border-radius:14px;
background:#ff8a00;
color:white;
cursor:pointer;
font-weight:bold;
}

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

@media(max-width:768px){

.sceneContainer{
height:50vh;
}

.objectBar{
grid-template-columns:repeat(5,1fr);
}
}
</style>
</head>

<body>

<!-- LOGO -->

<div id="logoScreen" class="screen">
<img src="assets/innovine-logo.png" alt="">
</div>

<!-- TITLE -->

<div id="titleScreen" class="screen hidden">
<div class="flashTitle">School Puzzle</div>
</div>

<!-- GAME -->

<div id="gameScreen" class="screen hidden">

<div class="header">
<h1>School Puzzle</h1>

<div class="questionRow">
<div class="question">Find the hidden objects</div>
<button class="listenBtn" onclick="speakQuestion()">🔊 Hear Again</button>
</div>
</div>

<div class="gameArea">

<div class="sceneContainer" id="scene">

<img src="assets/school.png">

<!-- Pear -->
<div class="hotspot" data-object="pear"
style="left:7%;top:7%;width:11%;height:13%;">
</div>

<!-- Bottle -->
<div class="hotspot" data-object="bottle"
style="left:83%;top:25%;width:10%;height:14%;">
</div>

<!-- Ball -->
<div class="hotspot" data-object="ball"
style="left:10%;top:42%;width:12%;height:12%;">
</div>

<!-- School Bag -->
<div class="hotspot" data-object="schoolbag"
style="left:42%;top:63%;width:14%;height:18%;">
</div>

<!-- Water Can -->
<div class="hotspot" data-object="watercan"
style="left:73%;top:66%;width:15%;height:15%;">
</div>

<!-- Pencil -->
<div class="hotspot" data-object="pencil"
style="left:2%;top:82%;width:12%;height:12%;">
</div>

<!-- Scissors -->
<div class="hotspot" data-object="scissors"
style="left:12%;top:83%;width:14%;height:14%;">
</div>

<!-- Paintbrush -->
<div class="hotspot" data-object="paintbrush"
style="left:66%;top:88%;width:10%;height:8%;">
</div>

<!-- Crayon Box -->
<div class="hotspot" data-object="crayonbox"
style="left:79%;top:82%;width:16%;height:14%;">
</div>

</div>
</div>

<div class="objectBar">

<div class="objectItem" id="obj-ball"><img src="assets/ball.png"></div>
<div class="objectItem" id="obj-bottle"><img src="assets/bottle.png"></div>
<div class="objectItem" id="obj-crayonbox"><img src="assets/crayonbox.png"></div>
<div class="objectItem" id="obj-paintbrush"><img src="assets/paintbrush.png"></div>
<div class="objectItem" id="obj-pear"><img src="assets/pear.png"></div>
<div class="objectItem" id="obj-pencil"><img src="assets/pencil.png"></div>
<div class="objectItem" id="obj-schoolbag"><img src="assets/schoolbag.png"></div>
<div class="objectItem" id="obj-scissors"><img src="assets/scissors.png"></div>
<div class="objectItem" id="obj-watercan"><img src="assets/watercan.png"></div>

</div>

</div>

<!-- FINISH -->

<div id="finishScreen" class="screen hidden">
<h2>🎉 Great Job! 🎉</h2>
<button class="playAgain" onclick="location.reload()">
Play Again
</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const foundObjects=new Set();
let wrongAttempts=0;

const totalObjects=9;

function speakQuestion(){

if('speechSynthesis' in window){

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(
"Find the hidden objects."
);

msg.rate=0.9;
msg.pitch=1;
speechSynthesis.speak(msg);
}
}

setTimeout(()=>{

document.getElementById("logoScreen").classList.add("hidden");
document.getElementById("titleScreen").classList.remove("hidden");

},5000);

setTimeout(()=>{

document.getElementById("titleScreen").classList.add("hidden");
document.getElementById("gameScreen").classList.remove("hidden");

speakQuestion();

},10000);

document.querySelectorAll(".hotspot").forEach(h=>{

h.addEventListener("click",()=>{

const obj=h.dataset.object;

if(foundObjects.has(obj)) return;

foundObjects.add(obj);

h.classList.add("correctFound");

document.getElementById("correctSound").play();

document.getElementById("clapSound").play();

const item=document.getElementById("obj-"+obj);

item.classList.add("found");

const tick=document.createElement("div");
tick.className="tick";
tick.innerHTML="✓";

item.appendChild(tick);

wrongAttempts=0;

speak("Good job");

if(foundObjects.size===totalObjects){

setTimeout(endGame,1200);
}

});
});

document.getElementById("scene").addEventListener("click",(e)=>{

if(e.target.classList.contains("hotspot")) return;

wrongAttempts++;

document.getElementById("wrongSound").play();

const img=document.querySelector(".sceneContainer img");

img.classList.remove("wiggle");
void img.offsetWidth;
img.classList.add("wiggle");

if(wrongAttempts>=2){

showHint();

wrongAttempts=0;
}
});

function showHint(){

const remaining=
[...document.querySelectorAll(".hotspot")]
.find(h=>!h.classList.contains("correctFound"));

if(remaining){

remaining.classList.add("glow");

setTimeout(()=>{
remaining.classList.remove("glow");
},3000);
}
}

function speak(text){

if('speechSynthesis' in window){

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(text);
msg.rate=.95;
speechSynthesis.speak(msg);
}
}

function endGame(){

document.getElementById("gameScreen").classList.add("hidden");
document.getElementById("finishScreen").classList.remove("hidden");

createConfetti();

speak("Fantastic! You found all the hidden objects!");
}

function createConfetti(){

for(let i=0;i<150;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";
c.style.top="-20px";

c.style.background=
`hsl(${Math.random()*360},90%,60%)`;

c.style.animationDelay=
(Math.random()*2)+"s";

document.body.appendChild(c);
}
}
</script>

</body>
</html>
