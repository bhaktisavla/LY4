<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Game</title>

<style>
body {
    margin:0;
    font-family: Arial;
    text-align:center;
    background:#f5f9ff;
}

/* SPLASH */
#splash {
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
#splash img {
    width:70%;
    max-width:400px;
}

/* GAME */
#game { display:none; padding:10px; }

.pattern {
    display:flex;
    justify-content:center;
    flex-wrap:nowrap;
    margin:10px 0;
}

.box, .option {
    width:22vw;
    height:22vw;
    max-width:110px;
    max-height:110px;
    margin:6px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.box {
    background:white;
    border:2px dashed #aaa;
}

.dropzone {
    border:3px solid #333;
}

.option {
    background:#6c9cff;
    color:white;
}

/* DRAG */
.dragging {
    position:fixed;
    pointer-events:none;
    z-index:999;
    transform:translate(-50%, -50%);
}

/* CONFETTI */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: fall 3s linear infinite;
}
@keyframes fall {
    to { transform: translateY(100vh); }
}

.feedback {
    height:30px;
    font-size:18px;
}

button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    font-size:16px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="game">

<h3 id="round"></h3>

<div class="pattern" id="patternRow"></div>
<div class="pattern" id="optionsRow"></div>

<div class="feedback" id="feedback"></div>

<button id="hearBtn" onclick="playQuestion()">🔊 Hear Question</button><br>

<button id="nextBtn" onclick="nextRound()" disabled>Next</button>
<button id="restartBtn" onclick="restartGame()" style="display:none;">Play Again</button>

</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="finishSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

// SPLASH 5 sec
window.onload = function() {
    setTimeout(()=>{
        document.getElementById("splash").style.display="none";
        document.getElementById("game").style.display="block";
    },5000);
};

// ROUNDS
const rounds = [
{seq:["🍎","🍌","🍎","🍌",""], ans:"🍎", text:"Complete the pattern A B"},
{seq:["🚗","🚌","🚗","🚌",""], ans:"🚗", text:"Complete the pattern A B"},
{seq:["🐶","🐶","🐱","🐶","🐶",""], ans:"🐱", text:"Complete the pattern A A B"},
{seq:["🌟","🌟","🌙","🌟","🌟",""], ans:"🌙", text:"Complete the pattern A A B"},
{seq:["🔺","🔵","⭐","🔺","🔵",""], ans:"⭐", text:"Complete the pattern A B C"},
{seq:["🍓","🍊","🍇","🍓","🍊",""], ans:"🍇", text:"Complete the pattern A B C"},
{seq:["🟥","🟥","🟦","🟦","🟥","🟥",""], ans:"🟦", text:"Complete the pattern A A B B"},
{seq:["🐸","🐸","🐼","🐼","🐸","🐸",""], ans:"🐼", text:"Complete the pattern A A B B"},
{seq:["🍏","🍎","🍎","🍏","🍎",""], ans:"🍎", text:"Complete the pattern A B B"},
{seq:["🚲","🚗","🚗","🚲","🚗",""], ans:"🚗", text:"Complete the pattern A B B"}
];

let current=0;
let dragEl=null;

// CLEAR DRAG (fix bug)
function clearDrag(){
    if(dragEl){
        dragEl.remove();
        dragEl=null;
    }
    document.removeEventListener("pointermove", moveDrag);
}

// CONFETTI
function showConfetti(){
    for(let i=0;i<40;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},70%,60%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),3000);
    }
}

// LOAD ROUND
function loadRound(){

    clearDrag();

    document.getElementById("restartBtn").style.display="none";

    if(current>=rounds.length){

        document.getElementById("patternRow").style.display="none";
        document.getElementById("optionsRow").style.display="none";
        document.getElementById("hearBtn").style.display="none";

        document.getElementById("round").innerHTML="🎉 Finished!";
        document.getElementById("feedback").innerHTML="";

        document.getElementById("nextBtn").style.display="none";
        document.getElementById("restartBtn").style.display="inline";

        document.getElementById("finishSound").play();

        showConfetti();

        return;
    }

    document.getElementById("patternRow").style.display="flex";
    document.getElementById("optionsRow").style.display="flex";
    document.getElementById("hearBtn").style.display="inline";

    document.getElementById("nextBtn").style.display="inline";
    document.getElementById("nextBtn").disabled=true;

    document.getElementById("round").innerHTML="Round "+(current+1)+"/10";
    document.getElementById("feedback").innerHTML="";

    let data=rounds[current];
    let p=document.getElementById("patternRow");
    let o=document.getElementById("optionsRow");

    p.innerHTML="";
    o.innerHTML="";

    data.seq.forEach(item=>{
        let d=document.createElement("div");
        d.className="box";

        if(item===""){
            d.classList.add("dropzone");
            d.dataset.answer=data.ans;

            d.addEventListener("pointerup",()=>{
                if(!dragEl) return;

                if(dragEl.innerHTML===d.dataset.answer){
                    d.innerHTML=dragEl.innerHTML;
                    document.getElementById("feedback").innerHTML="Correct!";
                    document.getElementById("correctSound").play();
                    document.getElementById("nextBtn").disabled=false;
                } else {
                    document.getElementById("feedback").innerHTML="Try again!";
                    document.getElementById("wrongSound").play();
                }

                clearDrag();
            });
        } else d.innerHTML=item;

        p.appendChild(d);
    });

    let options=[...new Set(data.seq.filter(x=>x!=""))];
    if(!options.includes(data.ans)) options.push(data.ans);

    options.forEach(opt=>{
        let d=document.createElement("div");
        d.className="option";
        d.innerHTML=opt;

        d.addEventListener("pointerdown",(e)=>{
            createDrag(d.innerHTML, e);
        });

        o.appendChild(d);
    });
}

// DRAG SYSTEM
function createDrag(content, e){

    clearDrag();

    dragEl=document.createElement("div");
    dragEl.className="option dragging";
    dragEl.innerHTML=content;

    document.body.appendChild(dragEl);
    moveDrag(e);

    document.addEventListener("pointermove", moveDrag);
    document.addEventListener("pointerup", clearDrag);
}

function moveDrag(e){
    if(dragEl){
        dragEl.style.left=e.clientX+"px";
        dragEl.style.top=e.clientY+"px";
    }
}

// NAVIGATION
function nextRound(){ current++; loadRound(); }

function restartGame(){
    current=0;
    document.getElementById("nextBtn").style.display="inline";
    loadRound();
}

// VOICE
function playQuestion(){
    let msg=new SpeechSynthesisUtterance(rounds[current].text);
    speechSynthesis.speak(msg);
}

// START
loadRound();

</script>

</body>
</html>
