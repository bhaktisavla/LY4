<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Game</title>

<style>
body {
    margin:0;
    font-family: Arial;
    text-align:center;
    background:#f5f9ff;
}

/* SPLASH */
#splash {
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
#splash img {
    width:70%;
    max-width:350px;
}

/* GAME */
#game { display:none; padding:8px; }

.pattern {
    display:flex;
    justify-content:center;
    gap:5px;
    margin:10px 0;
}

.options {
    display:flex;
    justify-content:center;
    gap:12px;
    margin:10px 0;
}

.box, .option {
    flex:1;
    max-width:70px;
    height:70px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.box {
    background:white;
    border:2px dashed #aaa;
}

.dropzone {
    border:3px solid #333;
}

.option {
    background:#6c9cff;
    color:white;
}

/* DRAG */
.dragging {
    position:fixed;
    pointer-events:none;
    z-index:999;
    transform:translate(-50%, -50%);
}

/* CONFETTI */
.confetti {
    position: fixed;
    width: 6px;
    height: 6px;
    top: -10px;
    animation: fall 3s linear infinite;
}
@keyframes fall {
    to { transform: translateY(100vh); }
}

button {
    padding:8px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#4CAF50;
    color:white;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div id="game">

<h3 id="round"></h3>

<div class="pattern" id="patternRow"></div>
<div class="options" id="optionsRow"></div>

<div id="feedback"></div>

<button id="nextBtn" onclick="nextRound()" disabled>Next</button>
<button id="restartBtn" onclick="restartGame()" style="display:none;">Play Again</button>

</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="finishSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

// SPLASH
window.onload = () => {
    setTimeout(()=>{
        splash.style.display="none";
        game.style.display="block";
    },5000);
};

// DATA
const rounds = [
{seq:["🟥","🟥","🟦","🟦","🟥","🟥",""], ans:"🟦"},
{seq:["🍎","🍌","🍎","🍌",""], ans:"🍎"},
{seq:["🐶","🐶","🐱","🐶","🐶",""], ans:"🐱"},
{seq:["🔺","🔵","⭐","🔺","🔵",""], ans:"⭐"},
{seq:["🍏","🍎","🍎","🍏","🍎",""], ans:"🍎"},
{seq:["🚗","🚌","🚗","🚌",""], ans:"🚗"},
{seq:["🌟","🌟","🌙","🌟","🌟",""], ans:"🌙"},
{seq:["🍓","🍊","🍇","🍓","🍊",""], ans:"🍇"},
{seq:["🐸","🐸","🐼","🐼","🐸","🐸",""], ans:"🐼"},
{seq:["🚲","🚗","🚗","🚲","🚗",""], ans:"🚗"}
];

let current=0;
let dragEl=null;
let dragValue=null;

function clearDrag(){
    if(dragEl){
        dragEl.remove();
        dragEl=null;
    }
    document.removeEventListener("pointermove", moveDrag);
}

// CONFETTI
function showConfetti(){
    for(let i=0;i<30;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},70%,60%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),3000);
    }
}

// LOAD ROUND
function loadRound(){

    clearDrag();
    restartBtn.style.display="none";

    if(current>=rounds.length){
        patternRow.style.display="none";
        optionsRow.style.display="none";

        round.innerHTML="🎉 Finished!";
        nextBtn.style.display="none";
        restartBtn.style.display="inline";

        finishSound.play();
        showConfetti();
        return;
    }

    let data=rounds[current];

    round.innerHTML="Round "+(current+1)+"/10";
    nextBtn.disabled=true;
    feedback.innerHTML="";

    patternRow.innerHTML="";
    optionsRow.innerHTML="";

    let dropBox = null;

    data.seq.forEach(item=>{
        let d=document.createElement("div");
        d.className="box";

        if(item===""){
            d.classList.add("dropzone");
            d.dataset.answer=data.ans;
            dropBox = d;
        } else {
            d.innerHTML=item;
        }

        patternRow.appendChild(d);
    });

    let options=[...new Set(data.seq.filter(x=>x!=""))];
    if(!options.includes(data.ans)) options.push(data.ans);

    options.forEach(opt=>{
        let d=document.createElement("div");
        d.className="option";
        d.innerHTML=opt;

        d.onpointerdown=(e)=>startDrag(opt,e);

        optionsRow.appendChild(d);
    });
}

// DRAG START
function startDrag(value,e){

    clearDrag();

    dragValue=value;

    dragEl=document.createElement("div");
    dragEl.className="option dragging";
    dragEl.innerHTML=value;

    document.body.appendChild(dragEl);

    moveDrag(e);

    document.addEventListener("pointermove", moveDrag);

    document.addEventListener("pointerup", drop, { once:true });
}

// MOVE
function moveDrag(e){
    if(dragEl){
        dragEl.style.left=e.clientX+"px";
        dragEl.style.top=e.clientY+"px";
    }
}

// DROP (AUTO SNAP)
function drop(){

    let dropzone = document.querySelector(".dropzone");

    if(dragValue === dropzone.dataset.answer){
        dropzone.innerHTML = dragValue;
        feedback.innerHTML="Correct!";
        correctSound.play();
        nextBtn.disabled=false;
    } else {
        feedback.innerHTML="Try again!";
        wrongSound.play();
    }

    clearDrag();
}

// NAV
function nextRound(){ current++; loadRound(); }

function restartGame(){
    current=0;
    nextBtn.style.display="inline";
    loadRound();
}

// START
loadRound();

</script>

</body>
</html>
