<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grouping Game</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif; }
body { background: url('assets/background.jpg') no-repeat center center fixed; background-size: cover; }
#splash { position: fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:white; z-index:1000; }
#splash img { max-width:300px; max-height:300px; }
#game-container { display:none; padding:10px; text-align:center; }
h1 { font-size:2rem; color:#2d2dff; margin-bottom:10px; }
#question { font-size:1.5rem; margin:10px 0; color:#ff6600; }
#repeatBtn { margin-bottom:10px; padding:5px 10px; font-size:1rem; cursor:pointer; background:#6fa8dc; border:none; border-radius:5px; color:white; }
#objects-box { background:white; border-radius:10px; padding:15px; display:flex; flex-wrap: wrap; justify-content:center; min-height:200px; margin-top:10px; position:relative; }
.obj { margin:5px; cursor:pointer; position:relative; transition: transform 0.2s; }
.obj img { width:60px; height:60px; object-fit:contain; user-select:none; -webkit-user-drag:none; }
.group-oval { position:absolute; border:4px solid green; border-radius:50%; pointer-events:none; transform: scale(0); transform-origin: center center; transition: transform 0.4s ease-out; }
.group-oval.show { transform: scale(1); }
#nextBtn { display:none; margin-top:20px; padding:10px 20px; font-size:1rem; cursor:pointer; background:#28a745; color:white; border:none; border-radius:5px; }
#confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; display:none; }

@media(max-width:600px){
    .obj img { width:50px; height:50px; }
    h1{ font-size:1.5rem; }
    #question{ font-size:1.2rem; }
}
</style>
</head>
<body>

<div id="splash">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="game-container">
    <h1>Grouping</h1>
    <div id="question"></div>
    <button id="repeatBtn">🔊 Hear Question Again</button>
    <div id="objects-box"></div>
    <button id="nextBtn">Next Round</button>
</div>

<canvas id="confetti-canvas"></canvas>

<audio id="correctAudio" src="assets/correct.mp3"></audio>
<audio id="wrongAudio" src="assets/wrong.mp3"></audio>
<audio id="clapAudio" src="assets/freesound_community-claps-44774.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const rounds = [
    { question: 'Circle the socks to group them into 2', img:'assets/sock.png', total:10, group:2 },
    { question: 'Circle the marbles to group them into 3', img:'assets/marble.png', total:12, group:3 },
    { question: 'Circle the dice to group them into 5', img:'assets/dice.png', total:15, group:5 },
    { question: 'Circle the balls to group them into 10', img:'assets/ball.png', total:20, group:10 },
    { question: 'Circle the balloons to group them into 3', img:'assets/pink-balloon.png', total:15, group:3 },
    { question: 'Circle the apples to group them into 5', img:'assets/apple.png', total:20, group:5 },
    { question: 'Circle the balloons to group them into 10', img:'assets/blue-balloon.png', total:20, group:10 }
];

let currentRound = 0;
let selectedObjs = [];
let groups = [];

const splash = document.getElementById('splash');
const gameContainer = document.getElementById('game-container');
const questionDiv = document.getElementById('question');
const objectsBox = document.getElementById('objects-box');
const repeatBtn = document.getElementById('repeatBtn');
const nextBtn = document.getElementById('nextBtn');
const correctAudio = document.getElementById('correctAudio');
const wrongAudio = document.getElementById('wrongAudio');
const clapAudio = document.getElementById('clapAudio');
const confettiCanvas = document.getElementById('confetti-canvas');

// Splash screen for 5 seconds
setTimeout(()=>{ splash.style.display='none'; gameContainer.style.display='block'; loadRound(); },5000);

function speak(text){
    if('speechSynthesis' in window){
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.9;
        speechSynthesis.speak(utter);
    }
}

repeatBtn.addEventListener('click', ()=>speak(rounds[currentRound].question));

function loadRound(){
    selectedObjs=[];
    groups=[];
    nextBtn.style.display='none';
    const round = rounds[currentRound];
    questionDiv.textContent = round.question;
    speak(round.question);
    objectsBox.innerHTML = '';
    let indices = Array.from({length:round.total},(_,i)=>i).sort(()=>Math.random()-0.5);
    indices.forEach(_=>{
        const div = document.createElement('div');
        div.classList.add('obj');
        const img = document.createElement('img');
        img.src = round.img;
        div.appendChild(img);
        div.addEventListener('click',()=>handleClick(div, round.group));
        objectsBox.appendChild(div);
    });
}

function handleClick(div, groupSize){
    if(selectedObjs.includes(div) || groups.some(g=>g.includes(div))) return;
    selectedObjs.push(div);

    if(selectedObjs.length === groupSize){
        createOval(selectedObjs);
        clapAudio.play();
        groups.push([...selectedObjs]);
        selectedObjs=[];
    }
}

function createOval(objs){
    const box = document.createElement('div');
    box.classList.add('group-oval');

    let minX = Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    objs.forEach(o=>{
        const rect = o.getBoundingClientRect();
        const parentRect = objectsBox.getBoundingClientRect();
        const x = rect.left - parentRect.left;
        const y = rect.top - parentRect.top;
        if(x<minX) minX=x;
        if(y<minY) minY=y;
        if(x+rect.width>maxX) maxX=x+rect.width;
        if(y+rect.height>maxY) maxY=y+rect.height;
    });

    box.style.left = minX - 5 +'px';
    box.style.top = minY - 5 +'px';
    box.style.width = (maxX - minX + 10)+'px';
    box.style.height = (maxY - minY + 10)+'px';

    objectsBox.appendChild(box);

    // Trigger smooth grow animation
    requestAnimationFrame(()=>{ box.classList.add('show'); });

    // Check if round completed
    if(groups.flat().length === rounds[currentRound].total){
        nextBtn.style.display='inline-block';
    }
}

nextBtn.addEventListener('click',()=>{
    currentRound++;
    if(currentRound<rounds.length){
        loadRound();
    } else {
        showConfetti();
    }
});

function showConfetti(){
    confettiCanvas.style.display='block';
    confetti({ particleCount:200, spread:70, origin:{y:0.6} });
    confetti({ particleCount:200, spread:100, origin:{y:0.6} });
    setTimeout(()=>{ confettiCanvas.style.display='none'; resetGame(); },3000);
}

function resetGame(){
    if(confirm('🎉 Great Job! Do you want to play again?')){
        currentRound=0;
        loadRound();
    }
}
</script>
</body>
</html>
