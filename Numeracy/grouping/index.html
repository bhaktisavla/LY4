<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Grouping Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
}

body{
    font-family:Arial, sans-serif;
    overflow:hidden;
    background:url('assets/background.jpg') center center/cover no-repeat;
    height:100vh;
}

#gameContainer{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    position:relative;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(2px);
}

header{
    width:100%;
    padding:10px;
    text-align:center;
    background:rgba(255,255,255,0.9);
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h1{
    color:#ff6b6b;
    font-size:clamp(24px,4vw,42px);
}

#roundText{
    margin-top:5px;
    font-size:clamp(14px,2vw,20px);
    color:#444;
    font-weight:bold;
}

#instructionBox{
    margin-top:10px;
    background:#fff8e7;
    border-radius:20px;
    padding:12px 16px;
    width:95%;
    max-width:1000px;
    text-align:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.15);
}

#instruction{
    font-size:clamp(18px,2.2vw,32px);
    color:#4b3f72;
    font-weight:bold;
}

#speakBtn{
    margin-top:10px;
    padding:8px 14px;
    border:none;
    border-radius:12px;
    background:#ffd166;
    font-size:16px;
    cursor:pointer;
}

#gameArea{
    position:relative;
    width:95%;
    flex:1;
    margin:10px auto;
    background:white;
    border-radius:25px;
    overflow:hidden;
    border:5px solid #ffffff;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.item{
    position:absolute;
    width:clamp(45px,7vw,80px);
    height:clamp(45px,7vw,80px);
    user-select:none;
}

.item img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    z-index:10;
}

#feedback{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(40px,7vw,90px);
    font-weight:bold;
    display:none;
    z-index:20;
}

.correct{
    color:#28a745;
}

.wrong{
    color:#ff3b3b;
}

.glow{
    animation:glow 1s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:0 0 10px #00ff88;
    }
    to{
        box-shadow:0 0 25px #00ff88;
    }
}

.shake{
    animation:shake 0.4s;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
    75%{transform:translateX(-5px);}
    100%{transform:translateX(0);}
}

#logoScreen{
    position:fixed;
    inset:0;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

#logoScreen img{
    width:min(60vw,300px);
}

#endScreen{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,0.95);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:50;
}

#endScreen h2{
    font-size:clamp(32px,5vw,60px);
    color:#ff6b6b;
    margin-bottom:20px;
}

#playAgain{
    padding:14px 30px;
    font-size:24px;
    border:none;
    border-radius:18px;
    background:#06d6a0;
    color:white;
    cursor:pointer;
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    background:red;
    top:-20px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div id="logoScreen">
    <img src="assets/innovine-logo.png">
</div>

<div id="gameContainer">

<header>
    <h1>Grouping</h1>
    <div id="roundText">Round 1 / 7</div>
</header>

<div id="instructionBox">
    <div id="instruction"></div>
    <button id="speakBtn">🔊 Hear Again</button>
</div>

<div id="gameArea">
    <canvas id="drawCanvas"></canvas>

    <div id="feedback"></div>

    <div id="endScreen">
        <h2>🎉 Great Job! 🎉</h2>
        <button id="playAgain">Play Again</button>
    </div>

</div>

</div>

<audio id="rightSound" src="assets/right.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

const rounds = [
{
instruction:"Circle the socks to group them into 2.",
image:"assets/sock.png",
count:10,
group:2
},
{
instruction:"Circle the marbles to group them into 3.",
image:"assets/marble.png",
count:12,
group:3
},
{
instruction:"Circle the dice to group them into 5.",
image:"assets/dice.png",
count:15,
group:5
},
{
instruction:"Circle the balls to group them into 10.",
image:"assets/ball.png",
count:20,
group:10
},
{
instruction:"Circle the balloons to group them into 3.",
image:"assets/pink-balloon.png",
count:15,
group:3
},
{
instruction:"Circle the apples to group them into 5.",
image:"assets/apple.png",
count:20,
group:5
},
{
instruction:"Circle the balloons to group them into 10.",
image:"assets/blue-balloon.png",
count:20,
group:10
}
];

const gameArea = document.getElementById("gameArea");
const instruction = document.getElementById("instruction");
const roundText = document.getElementById("roundText");
const feedback = document.getElementById("feedback");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

const rightSound = document.getElementById("rightSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

let currentRound = 0;
let grouped = [];
let wrongAttempts = 0;

let drawing = false;
let points = [];

function resizeCanvas(){
    canvas.width = gameArea.clientWidth;
    canvas.height = gameArea.clientHeight;
}
window.addEventListener("resize", resizeCanvas);

function speak(text){
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = 0.9;
    speechSynthesis.speak(msg);
}

document.getElementById("speakBtn").addEventListener("click",()=>{
    speak(rounds[currentRound].instruction);
});

function startRound(){

    grouped = [];
    wrongAttempts = 0;

    gameArea.querySelectorAll(".item").forEach(el=>el.remove());

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const round = rounds[currentRound];

    instruction.textContent = round.instruction;
    roundText.textContent = `Round ${currentRound+1} / 7`;

    speak(round.instruction);

    createItems(round);

}

function createItems(round){

    const cols = Math.ceil(Math.sqrt(round.count));

    const paddingX = gameArea.clientWidth / (cols+1);

    const rows = Math.ceil(round.count / cols);

    const paddingY = gameArea.clientHeight / (rows+1);

    for(let i=0;i<round.count;i++){

        const item = document.createElement("div");
        item.className = "item";
        item.dataset.index = i;

        const img = document.createElement("img");
        img.src = round.image;

        item.appendChild(img);

        const col = i % cols;
        const row = Math.floor(i / cols);

        item.style.left = (paddingX*(col+1)-35) + "px";
        item.style.top = (paddingY*(row+1)-35) + "px";

        gameArea.appendChild(item);
    }
}

function showFeedback(text,correct=true){

    feedback.innerHTML = text;
    feedback.className = correct ? "correct" : "wrong";
    feedback.style.display = "block";

    setTimeout(()=>{
        feedback.style.display = "none";
    },1000);
}

function pointInPolygon(point, vs) {

    let x = point.x, y = point.y;

    let inside = false;

    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {

        let xi = vs[i].x, yi = vs[i].y;
        let xj = vs[j].x, yj = vs[j].y;

        let intersect = ((yi > y) != (yj > y))
            && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);

        if (intersect) inside = !inside;
    }

    return inside;
}

function getSelectedItems(){

    const items = [...document.querySelectorAll(".item")];

    return items.filter(item=>{

        if(grouped.includes(item.dataset.index)) return false;

        const rect = item.getBoundingClientRect();
        const parentRect = gameArea.getBoundingClientRect();

        const center = {
            x: rect.left - parentRect.left + rect.width/2,
            y: rect.top - parentRect.top + rect.height/2
        };

        return pointInPolygon(center, points);
    });
}

function drawPath(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(points.length < 2) return;

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);

    for(let p of points){
        ctx.lineTo(p.x,p.y);
    }

    ctx.strokeStyle = "#00c853";
    ctx.lineWidth = 6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();
}

function pointerPos(e){

    const rect = canvas.getBoundingClientRect();

    let x,y;

    if(e.touches){
        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;
    }else{
        x = e.clientX - rect.left;
        y = e.clientY - rect.top;
    }

    return {x,y};
}

function startDraw(e){

    drawing = true;
    points = [];

    const pos = pointerPos(e);

    points.push(pos);
}

function moveDraw(e){

    if(!drawing) return;

    const pos = pointerPos(e);

    points.push(pos);

    drawPath();
}

function endDraw(){

    if(!drawing) return;

    drawing = false;

    const selected = getSelectedItems();

    const needed = rounds[currentRound].group;

    if(selected.length === needed){

        selected.forEach(item=>{
            grouped.push(item.dataset.index);
            item.classList.add("glow");
        });

        rightSound.play();

        showFeedback("✔ Good Job!",true);

        if(grouped.length === rounds[currentRound].count){

            setTimeout(()=>{

                clapSound.play();

                currentRound++;

                if(currentRound >= rounds.length){

                    endGame();

                }else{

                    startRound();

                }

            },1200);
        }

    }else{

        wrongAttempts++;

        wrongSound.play();

        showFeedback("✖ Try Again",false);

        gameArea.classList.add("shake");

        setTimeout(()=>{
            gameArea.classList.remove("shake");
        },400);

        if(wrongAttempts >= 2){

            const items = [...document.querySelectorAll(".item")]
            .filter(item=>!grouped.includes(item.dataset.index));

            for(let i=0;i<rounds[currentRound].group;i++){

                if(items[i]){
                    items[i].classList.add("glow");
                }
            }
        }
    }

    setTimeout(()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
    },500);

}

canvas.addEventListener("mousedown",startDraw);
canvas.addEventListener("mousemove",moveDraw);
canvas.addEventListener("mouseup",endDraw);

canvas.addEventListener("touchstart",startDraw);
canvas.addEventListener("touchmove",moveDraw);
canvas.addEventListener("touchend",endDraw);

function endGame(){

    document.getElementById("endScreen").style.display = "flex";

    createConfetti();
}

function createConfetti(){

    for(let i=0;i<120;i++){

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left = Math.random()*100 + "vw";

        confetti.style.background = `hsl(${Math.random()*360},80%,60%)`;

        confetti.style.animationDuration = (Math.random()*3+2)+"s";

        confetti.style.width = (Math.random()*8+6)+"px";
        confetti.style.height = confetti.style.width;

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);
    }
}

document.getElementById("playAgain").addEventListener("click",()=>{

    currentRound = 0;

    document.getElementById("endScreen").style.display = "none";

    startRound();

});

setTimeout(()=>{

    document.getElementById("logoScreen").style.display = "none";

    resizeCanvas();

    startRound();

},5000);

</script>

</body>
</html>
