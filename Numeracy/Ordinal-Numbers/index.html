<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ordinal Numbers - Pet Parade</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,sans-serif;
overflow:hidden;
height:100vh;
background:url('assets/racetrack.png') center center/cover no-repeat;
}

/* LOGO */

#logoScreen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#ffe27a,#ffd6ec,#b9ebff);
z-index:9999;
}

#logoScreen img{
width:min(300px,70vw);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}

/* TITLE */

#titleScreen{
position:fixed;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
background:linear-gradient(to bottom,#ffe27a,#ffd6ec,#b9ebff);
text-align:center;
padding:20px;
}

.title{
font-size:clamp(40px,7vw,70px);
font-weight:bold;
color:#ff4f8b;
text-shadow:3px 3px white;
}

.subTitle{
font-size:clamp(22px,4vw,38px);
font-weight:bold;
color:#5a42ff;
}

.startBtn{
padding:16px 32px;
font-size:26px;
border:none;
border-radius:18px;
background:#ff9f43;
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 0 #d9791e;
}

/* GAME */

#gameContainer{
height:100vh;
display:none;
flex-direction:column;
align-items:center;
padding:8px;
}

.header{
text-align:center;
}

.header h1{
font-size:clamp(32px,6vw,56px);
color:#ff4f8b;
text-shadow:3px 3px white;
}

.roundText{
font-size:clamp(18px,3vw,28px);
font-weight:bold;
color:#5a42ff;
margin-top:2px;
}

.questionBox{
width:95%;
max-width:1000px;
background:#ffffffd9;
border-radius:24px;
padding:12px;
margin-top:8px;
text-align:center;
box-shadow:0 5px 16px rgba(0,0,0,0.12);
}

.question{
font-size:clamp(18px,2vw,28px);
font-weight:bold;
color:#444;
line-height:1.4;
}

.listenBtn{
margin-top:10px;
padding:10px 18px;
font-size:18px;
border:none;
border-radius:14px;
background:#58c7ff;
color:white;
font-weight:bold;
}

/* PARADE */

.paradeArea{
flex:1;
width:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.paradeRow{
width:100%;
max-width:1250px;
background:#ffffffd8;
border-radius:28px;
padding:12px;
display:flex;
justify-content:space-evenly;
align-items:flex-end;
gap:6px;
box-shadow:0 6px 18px rgba(0,0,0,0.12);
}

.petBox{
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
cursor:pointer;
padding:4px;
border-radius:16px;
transition:0.2s;
}

.petBox img{
width:80px;
height:80px;
object-fit:contain;
}

.ordinal{
font-size:clamp(14px,2vw,22px);
font-weight:bold;
color:#ff7b00;
}

/* FEEDBACK */

.feedback{
height:42px;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:bold;
color:#24a148;
}

/* ANIMATION */

.wiggle{
animation:wiggle 0.35s;
}

@keyframes wiggle{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

.correctGlow{
animation:glow 1s infinite;
}

@keyframes glow{
0%{box-shadow:0 0 0 gold;}
50%{box-shadow:0 0 18px gold;}
100%{box-shadow:0 0 0 gold;}
}

/* END */

#endScreen{
position:fixed;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#ffe27a,#ffd6ec,#b9ebff);
gap:20px;
text-align:center;
}

#endScreen h2{
font-size:clamp(40px,7vw,70px);
color:#ff4f8b;
}

#endScreen p{
font-size:clamp(24px,4vw,40px);
font-weight:bold;
color:#5a42ff;
}

.confetti{
position:fixed;
width:14px;
height:14px;
border-radius:50%;
top:-20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

/* MOBILE */

@media(max-width:700px){

.petBox img{
width:42px;
height:42px;
}

.paradeRow{
gap:2px;
padding:8px 4px;
}

.ordinal{
font-size:11px;
}

.question{
font-size:16px;
}

.listenBtn{
font-size:15px;
padding:8px 14px;
}

}

</style>
</head>

<body>

<audio id="rightSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<!-- LOGO -->

<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->

<div id="titleScreen">

<div class="title">Pet Parade</div>

<div class="subTitle">
Ordinal Numbers Game
</div>

<button class="startBtn" onclick="startGame()">
Start Game
</button>

</div>

<!-- GAME -->

<div id="gameContainer">

<div class="header">

<h1>Pet Parade</h1>

<div class="roundText" id="roundText"></div>

</div>

<div class="questionBox">

<div class="question" id="questionText"></div>

<button class="listenBtn" onclick="speakQuestion()">
🔊 Hear Again
</button>

</div>

<div class="paradeArea">

<div class="paradeRow" id="paradeRow"></div>

</div>

<div class="feedback" id="feedback"></div>

</div>

<!-- END -->

<div id="endScreen">

<h2>🎉 Well Done! 🎉</h2>

<p>You completed the Pet Parade!</p>

<button class="startBtn" onclick="restartGame()">
Play Again
</button>

</div>

<script>

const pets = [

{ name:"Dog", image:"assets/dog.png" },
{ name:"Cat", image:"assets/cat.png" },
{ name:"Bunny", image:"assets/bunny.png" },
{ name:"Turtle", image:"assets/turtle.png" },
{ name:"Bird", image:"assets/bird.png" },
{ name:"Hamster", image:"assets/hamster.png" },
{ name:"Fish", image:"assets/fish.png" },
{ name:"Guinea Pig", image:"assets/guineapig.png" },
{ name:"Hedgehog", image:"assets/hedgehog.png" },
{ name:"Puppy", image:"assets/puppy.png" }

];

const ordinals = [
"1st","2nd","3rd","4th","5th",
"6th","7th","8th","9th","10th"
];

let rounds = [];
let currentRound = 0;
let wrongAttempts = 0;

const paradeRow = document.getElementById("paradeRow");
const questionText = document.getElementById("questionText");
const feedback = document.getElementById("feedback");
const roundText = document.getElementById("roundText");

window.onload = ()=>{

setTimeout(()=>{

document.getElementById("logoScreen").style.display="none";

document.getElementById("titleScreen").style.display="flex";

},5000);

};

/* CREATE RANDOM ROUNDS */

function createRounds(){

rounds=[];

for(let i=0;i<10;i++){

const correctPosition =
Math.floor(Math.random()*10);

rounds.push({

position:correctPosition,
pet:pets[correctPosition]

});

}

}

function startGame(){

document.getElementById("titleScreen").style.display="none";

document.getElementById("gameContainer").style.display="flex";

createRounds();

loadRound();

}

function loadRound(){

wrongAttempts=0;

feedback.innerHTML="";

paradeRow.innerHTML="";

const round = rounds[currentRound];

roundText.innerHTML =
`Round ${currentRound+1} / ${rounds.length}`;

questionText.innerHTML =
`Who is in the ${ordinals[round.position]} place?`;

speakQuestion();

pets.forEach((pet,index)=>{

const petBox = document.createElement("div");

petBox.classList.add("petBox");

petBox.dataset.correct =
(index === round.position);

petBox.innerHTML =

`
<div class="ordinal">${ordinals[index]}</div>
<img src="${pet.image}">
`;

petBox.addEventListener("click",()=>{

checkAnswer(petBox,index);

});

paradeRow.appendChild(petBox);

});

}

function checkAnswer(box,index){

const round = rounds[currentRound];

if(index === round.position){

box.classList.add("correctGlow");

document.getElementById("rightSound").play();

document.getElementById("clapSound").play();

feedback.innerHTML =
"✅ Good Job!";

setTimeout(()=>{

currentRound++;

if(currentRound >= rounds.length){

endGame();

}else{

loadRound();

}

},1600);

}else{

wrongAttempts++;

document.getElementById("wrongSound").play();

box.classList.add("wiggle");

setTimeout(()=>{
box.classList.remove("wiggle");
},400);

if(wrongAttempts >=2){

document.querySelectorAll(".petBox")
[round.position]
.classList.add("correctGlow");

}

}

}

function speakQuestion(){

speechSynthesis.cancel();

const round = rounds[currentRound];

const speech =
new SpeechSynthesisUtterance(

`Who is in the ${ordinals[round.position]} place?`

);

speech.rate = 0.9;
speech.pitch = 1;

speechSynthesis.speak(speech);

}

function endGame(){

document.getElementById("gameContainer")
.style.display="none";

document.getElementById("endScreen")
.style.display="flex";

createConfetti();

}

function createConfetti(){

for(let i=0;i<120;i++){

const confetti =
document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left =
Math.random()*100+"vw";

confetti.style.background =
["#ff4f8b","#ffb703","#5a42ff","#58c7ff","#7dff7d"]
[Math.floor(Math.random()*5)];

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

function restartGame(){

currentRound = 0;

document.getElementById("endScreen")
.style.display="none";

document.getElementById("gameContainer")
.style.display="flex";

createRounds();

loadRound();

}

</script>

</body>
</html>
