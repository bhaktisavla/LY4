<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordinal Numbers - Visual Parade</title>
<style>
body { margin:0; font-family:'Comic Sans MS', cursive, sans-serif; display:flex; flex-direction:column; align-items:center; background:#FFF7E6; }
header { width:100%; text-align:center; font-size:2rem; font-weight:bold; background:#FFD6A5; color:#4E4E4E; padding:10px; }
#logoSplash { position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; justify-content:center; align-items:center; z-index:999; }
#logoSplash img { width:200px; }

#gameContainer { width:100%; min-height:100vh; display:none; flex-direction:column; align-items:center; padding:10px; background:url('assets/racetrack.png') no-repeat center center; background-size:cover; border-radius:10px; }

#questionBox { background:#FFEDD5; padding:12px 15px; border-radius:10px; margin-bottom:5px; display:flex; align-items:center; width:95%; max-width:1024px; }
#questionBox img { width:60px; height:auto; margin-right:10px; object-fit:contain; border-radius:5px; }
#questionBox button { margin-left:10px; border:none; padding:6px 10px; border-radius:5px; background:#FFB77D; color:white; font-weight:bold; cursor:pointer; }

#ordinalRow { display:flex; justify-content:center; flex-wrap:wrap; margin-bottom:10px; gap:8px; }
.ordinalBox { width:60px; height:60px; border:2px dashed #4E4E4E; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1rem; background:#fff; position:relative; }

#petsContainer { display:flex; justify-content:flex-start; gap:10px; margin-bottom:10px; min-height:120px; width:95%; max-width:1024px; position:relative; }

.petCard { width:80px; height:80px; border-radius:10px; background:#FFF; display:flex; align-items:center; justify-content:center; border:3px solid transparent; cursor:pointer; position:relative; transition: transform 0.3s, border 0.3s; }
.petCard img { max-width:70%; max-height:70%; }

.petCard.first { transform: scale(1.1); border: 3px solid gold; z-index:2; }
.petCard.hop { animation: hop 1.5s ease-in-out infinite alternate; }

#messageBox { font-size:1.4rem; margin:5px; color:green; font-weight:bold; min-height:2em; text-align:center; }
#nextBtn { padding:10px 20px; font-size:1.2rem; border:none; border-radius:10px; background:#FFB77D; color:white; cursor:pointer; display:none; margin-top:5px; }
#confettiCanvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1000; }

@keyframes hop {0%{transform:translateY(0);}100%{transform:translateY(-10px);}}
@keyframes wiggle {0%{transform:rotate(0deg);}25%{transform:rotate(10deg);}50%{transform:rotate(-10deg);}75%{transform:rotate(10deg);}100%{transform:rotate(0deg);}}
@media(max-width:600px){ .petCard{width:60px;height:60px;} .ordinalBox{width:45px;height:45px;font-size:0.9rem;} #questionBox img{width:50px;} }
</style>
</head>
<body>

<header>Ordinal Numbers</header>

<div id="logoSplash">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameContainer">
    <div id="questionBox">
        <img src="assets/instructor.png" alt="Instructor">
        <span id="questionText"></span>
        <button id="replayBtn">🔊</button>
    </div>

    <div id="ordinalRow"></div>
    <div id="petsContainer"></div>
    <div id="messageBox"></div>
    <button id="nextBtn">Next</button>
</div>

<canvas id="confettiCanvas"></canvas>
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
// Define rounds
const rounds=[
  {type:'click', question:'Who is in 1st place?', correct:'dog', pets:['dog','cat','bunny','turtle','bird','hamster','fish','guineapig','hedgehog','puppy']},
  {type:'click', question:'Who is in 3rd place?', correct:'bunny', pets:['dog','cat','bunny','turtle','bird','hamster','fish','guineapig','hedgehog','puppy']},
  {type:'click', question:'Who is in 6th place?', correct:'hamster', pets:['dog','cat','bunny','turtle','bird','hamster','fish','guineapig','hedgehog','puppy']},
  {type:'arrange', question:'Move the 1st carriage to the engine', correctOrder:['dog','cat','bunny','turtle','bird','hamster','fish','guineapig','hedgehog','puppy'], pets:['dog','cat','bunny','turtle','bird','hamster','fish','guineapig','hedgehog','puppy']}
];

let currentRound=0, attempts=0;
const gameContainer=document.getElementById('gameContainer');
const questionText=document.getElementById('questionText');
const petsContainer=document.getElementById('petsContainer');
const ordinalRow=document.getElementById('ordinalRow');
const messageBox=document.getElementById('messageBox');
const nextBtn=document.getElementById('nextBtn');
const replayBtn=document.getElementById('replayBtn');
const correctSound=document.getElementById('correctSound');
const wrongSound=document.getElementById('wrongSound');

window.addEventListener('load',()=>{ setTimeout(()=>{ document.getElementById('logoSplash').style.display='none'; gameContainer.style.display='flex'; loadRound(); },5000); });

function loadRound(){
  attempts=0; nextBtn.style.display='none'; petsContainer.innerHTML=''; ordinalRow.innerHTML=''; messageBox.innerText='';
  const round=rounds[currentRound];
  questionText.innerText=round.question;

  for(let i=0;i<10;i++){
    const box=document.createElement('div'); box.classList.add('ordinalBox'); box.dataset.index=i;
    box.innerText=`${i+1}${['st','nd','rd','th','th','th','th','th','th','th'][i]}`;
    ordinalRow.appendChild(box);
  }

  const pets=[...round.pets];
  pets.forEach((p,index)=>{
    const card=document.createElement('div'); card.classList.add('petCard','hop');
    const img=document.createElement('img'); img.src=`assets/${p}.png`; img.alt=p; card.appendChild(img);
    if(index===0) card.classList.add('first'); // first-place highlight

    petsContainer.appendChild(card);

    if(round.type==='click'){
      card.addEventListener('click',()=> handleClick(p,card));
    } else {
      card.setAttribute('draggable','true');
      card.addEventListener('dragstart',dragStart);
      card.addEventListener('dragover',dragOver);
      card.addEventListener('drop',drop);
      card.addEventListener('dragend',dragEnd);
    }
  });
}

function handleClick(p,card){
  const round=rounds[currentRound];
  if(p===round.correct){ card.classList.add('correct'); correctSound.play(); messageBox.innerText='Good Job!'; nextBtn.style.display='inline-block'; }
  else{ attempts++; card.classList.add('wrong'); wrongSound.play(); setTimeout(()=>card.classList.remove('wrong'),300); }
}

nextBtn.addEventListener('click',()=>{ currentRound++; if(currentRound>=rounds.length){ alert("🎉 All rounds completed!"); } else{ loadRound(); } });

let dragged;
function dragStart(e){ dragged=e.target; }
function dragOver(e){ e.preventDefault(); }
function drop(e){ if(e.target.classList.contains('ordinalBox')){ e.target.appendChild(dragged); } }
function dragEnd(){}
</script>
</body>
</html>
