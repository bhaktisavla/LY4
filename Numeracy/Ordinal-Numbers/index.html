<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordinal Numbers - Pet Parade</title>
<style>
    body { margin:0; font-family:'Comic Sans MS', cursive, sans-serif; background:#FFF7E6; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh; }
    header { width:100%; text-align:center; font-size:2rem; font-weight:bold; background:#FFD6A5; color:#4E4E4E; padding:10px; }
    #logoSplash { position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; justify-content:center; align-items:center; z-index:999; }
    #logoSplash img { width:200px; }
    #gameContainer { width:100%; max-width:1024px; display:none; flex-direction:column; align-items:center; padding:10px; }
    #questionBox { background:#FFEDD5; padding:12px 15px; border-radius:10px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:#4E4E4E; }
    #questionBox button { margin-left:10px; border:none; padding:6px 10px; border-radius:5px; background:#FFB77D; color:white; font-weight:bold; cursor:pointer; }
    #ordinalRow { display:flex; justify-content:center; flex-wrap:wrap; margin-bottom:10px; gap:8px; }
    .ordinalBox { width:60px; height:60px; border:2px dashed #4E4E4E; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1rem; background:#fff; position:relative; }
    #petsContainer { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:10px; }
    .petCard { width:80px; height:80px; border-radius:10px; background:#FFF; display:flex; align-items:center; justify-content:center; border:3px solid transparent; cursor:pointer; transition: transform 0.2s, border 0.2s; }
    .petCard img { max-width:70%; max-height:70%; }
    .petCard.wrong { animation: wiggle 0.3s; }
    .petCard.correct { border:3px solid green; }
    #messageBox { font-size:1.4rem; margin:5px; color:green; font-weight:bold; min-height:2em; text-align:center; }
    #nextBtn { padding:10px 20px; font-size:1.2rem; border:none; border-radius:10px; background:#FFB77D; color:white; cursor:pointer; display:none; margin-top:5px; }
    #confettiCanvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1000; }
    @keyframes wiggle {0%{transform:rotate(0deg);}25%{transform:rotate(10deg);}50%{transform:rotate(-10deg);}75%{transform:rotate(10deg);}100%{transform:rotate(0deg);}}
    @media(max-width:600px){ .petCard{width:60px;height:60px;} .ordinalBox{width:45px;height:45px;font-size:0.9rem;} }
</style>
</head>
<body>
<header>Ordinal Numbers</header>

<div id="logoSplash">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameContainer">
    <div id="questionBox">
        <span id="questionText"></span>
        <button id="replayBtn">🔊</button>
    </div>

    <div id="ordinalRow"></div>
    <div id="petsContainer"></div>
    <div id="messageBox"></div>
    <button id="nextBtn">Next</button>
</div>

<canvas id="confettiCanvas"></canvas>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const rounds = [
    // Option A: Click question rounds
    {type:'click', question:'Who is in 1st place?', correct:'dog', pets:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Who is in first place?'},
    {type:'click', question:'Who is in 3rd place?', correct:'bunny', pets:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Who is in third place?'},
    {type:'click', question:'Who is in 5th place?', correct:'parrot', pets:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Who is in fifth place?'},
    {type:'click', question:'Who is in 7th place?', correct:'fish', pets:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Who is in seventh place?'},
    {type:'click', question:'Who is in 10th place?', correct:'puppy', pets:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Who is in tenth place?'},

    // Option B: Drag & drop rounds
    {type:'arrange', question:'Place the dog in 1st position', correctOrder:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Place the dog in first position'},
    {type:'arrange', question:'Place the cat in 2nd position', correctOrder:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Place the cat in second position'},
    {type:'arrange', question:'Place the bunny in 3rd position', correctOrder:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Place the bunny in third position'},
    {type:'arrange', question:'Place the turtle in 4th position', correctOrder:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Place the turtle in fourth position'},
    {type:'arrange', question:'Place the parrot in 5th position', correctOrder:['dog','cat','bunny','turtle','parrot','hamster','fish','guineapig','hedgehog','puppy'], voice:'Place the parrot in fifth position'}
];

let currentRound = 0;
let attempts = 0;
const gameContainer = document.getElementById('gameContainer');
const questionText = document.getElementById('questionText');
const petsContainer = document.getElementById('petsContainer');
const ordinalRow = document.getElementById('ordinalRow');
const messageBox = document.getElementById('messageBox');
const nextBtn = document.getElementById('nextBtn');
const replayBtn = document.getElementById('replayBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

window.addEventListener('load',()=>{
    setTimeout(()=>{
        document.getElementById('logoSplash').style.display='none';
        gameContainer.style.display='flex';
        loadRound();
    },5000);
});

replayBtn.addEventListener('click', ()=> playVoice(rounds[currentRound].voice));

function playVoice(text){
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate=0.9;
    speechSynthesis.speak(utter);
}

function loadRound(){
    attempts=0;
    nextBtn.style.display='none';
    petsContainer.innerHTML='';
    ordinalRow.innerHTML='';
    messageBox.innerText='';
    const round = rounds[currentRound];
    questionText.innerText = round.question;
    playVoice(round.voice);

    // create ordinal boxes
    for(let i=1;i<=10;i++){
        const box = document.createElement('div');
        box.classList.add('ordinalBox');
        box.dataset.index=i-1;
        box.innerText = `${i}${['st','nd','rd','th','th','th','th','th','th','th'][i-1]}`;
        ordinalRow.appendChild(box);
    }

    // shuffle pets for display
    const pets = [...round.pets].sort(()=> Math.random()-0.5);
    pets.forEach(p=>{
        const card = document.createElement('div');
        card.classList.add('petCard');
        const img = document.createElement('img');
        img.src=`assets/${p}.png`;
        img.alt=p;
        card.appendChild(img);
        petsContainer.appendChild(card);

        if(round.type==='click'){
            card.addEventListener('click', ()=> handleClick(p, card));
        } else {
            card.setAttribute('draggable','true');
            card.addEventListener('dragstart', dragStart);
            card.addEventListener('dragover', dragOver);
            card.addEventListener('drop', drop);
            card.addEventListener('dragend', dragEnd);
        }
    });
}

// Option A click handler
function handleClick(p, card){
    const round = rounds[currentRound];
    if(p===round.correct){
        card.classList.add('correct');
        correctSound.play();
        messageBox.innerText='Good Job!';
        nextBtn.style.display='inline-block';
    } else{
        attempts++;
        card.classList.add('wrong');
        wrongSound.play();
        setTimeout(()=> card.classList.remove('wrong'),300);
        if(attempts>=2){
            const correctCard = [...document.querySelectorAll('.petCard')].find(c=>c.querySelector('img').alt===round.correct);
            correctCard.classList.add('correct');
            nextBtn.style.display='inline-block';
        }
    }
}

// Next round
nextBtn.addEventListener('click', ()=>{
    currentRound++;
    if(currentRound>=rounds.length){
        showConfetti();
    } else{
        loadRound();
    }
});

// Drag & Drop for Option B
let dragged;
function dragStart(e){ dragged=e.target; }
function dragOver(e){ e.preventDefault(); }
function drop(e){
    if(e.target.classList.contains('ordinalBox')){
        const card = dragged;
        const box = e.target;
        box.appendChild(card);
        card.dataset.position = box.dataset.index;

        // check if correct
        const round = rounds[currentRound];
        const placedCorrect = [...ordinalRow.children].every((b,i)=>{
            const child = b.querySelector('.petCard');
            return child && child.querySelector('img').alt===round.correctOrder[i];
        });
        if(placedCorrect){
            correctSound.play();
            messageBox.innerText='Well Done!';
            nextBtn.style.display='inline-block';
        }
    }
}
function dragEnd(){}

// Confetti celebration
function showConfetti(){
    messageBox.innerText='🎉 Congratulations! You completed all rounds!';
    const canvas=document.getElementById('confettiCanvas');
    const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
    let confettis=[];
    for(let i=0;i<150;i++){
        confettis.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*6+4,d:Math.random()*10+2,color:`hsl(${Math.random()*360},70%,60%)`});
    }
    let timer=setInterval(()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        confettis.forEach(c=>{
            ctx.fillStyle=c.color;
            ctx.beginPath();
            ctx.arc(c.x,c.y,c.r,0,2*Math.PI);
            ctx.fill();
            c.y+=c.d;
            if(c.y>canvas.height) c.y=0;
        });
    },30);
    nextBtn.innerText='Play Again';
    nextBtn.style.display='inline-block';
    nextBtn.onclick=()=>{
        timer && clearInterval(timer);
        currentRound=0;
        nextBtn.innerText='Next';
        loadRound();
    }
}
</script>
</body>
</html>
